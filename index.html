<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4e8a00">
    <meta name="description" content="Flash cards, lessons, practice questions and readings for the NVIDIA NCP-GENL (Generative AI LLMs) certification.">
    <title>GenL Cards</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="cardkit/katex/katex.min.css">
    <link rel="stylesheet" href="cardkit/prism/prism-okaidia.min.css">
    <link rel="stylesheet" href="cardkit/card.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div id="app">
        <header class="topbar">
            <button class="icon-btn" id="open-drawer" aria-label="Groups and options">☰</button>
            <div class="brand"><span class="nabla">∇</span> GenL Cards</div>
            <button class="icon-btn" id="open-print" aria-label="Print or save as PDF" title="Print / Save as PDF">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>
                </svg>
            </button>
        </header>
        <div class="chips" id="kind-switch"></div>
        <div class="switches">
            <div class="segmented" id="study-switch">
                <button data-value="learn">Learn</button>
                <button data-value="test">Test</button>
            </div>
        </div>
        <div class="status" id="status"></div>
        <main id="stage"></main>
        <nav class="actions" id="actions"></nav>
    </div>

    <div class="backdrop" id="backdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
        <div class="drawer-head">
            <div class="brand"><span class="nabla">∇</span> GenL Cards</div>
            <button class="icon-btn" id="close-drawer" aria-label="Close">✕</button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
        <div class="drawer-foot" id="drawer-foot"></div>
    </aside>

    <dialog id="print-dialog"></dialog>
    <dialog id="note-dialog"></dialog>
    <section id="print-area" aria-hidden="true"></section>

    <script src="cardkit/katex/katex.min.js"></script>
    <script src="cardkit/katex/contrib/auto-render.min.js"></script>
    <script src="cardkit/prism/prism-core.min.js"></script>
    <script src="cardkit/prism/prism-clike.min.js"></script>
    <script src="cardkit/prism/prism-markup.min.js"></script>
    <script src="cardkit/prism/prism-python.min.js"></script>
    <script src="cardkit/prism/prism-bash.min.js"></script>
    <script src="cardkit/prism/prism-json.min.js"></script>
    <script src="cardkit/prism/prism-yaml.min.js"></script>
    <script src="cardkit/card.js"></script>
    <script src="app.js"></script>
</body>
</html>
