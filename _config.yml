title: NCP-GENL
description: NVIDIA-Certified Professional — Generative AI LLMs study verses
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: true

optional_front_matter:
  remove_originals: false

titles_from_headings:
  enabled: true
  strip_title: false
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - labs/**/*.sh
  - "**/*.sh"
  - .git
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor
