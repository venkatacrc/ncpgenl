<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4b3fd1">
    <title>HSTU Cards</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex;
            justify-content: center; align-items: center; min-height: 100vh; margin: 0;
            background: linear-gradient(160deg, #f3f4fa, #e4e8f8); color: #1a1a1a; }
        .card { background: #fff; padding: 1.75rem; border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.08);
            text-align: center; width: min(340px, 92vw); border: 1px solid #dcdfeb; }
        .logo {
            font-weight: 900; font-size: 1.6rem;
            background: linear-gradient(#4d9eff, #5c1fa8);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        h1 { font-size: 1.25rem; margin: 0 0 .35rem; }
        p { color: #555; font-size: .95rem; margin: 0 0 1rem; }
        input { padding: 12px; margin: 0 0 10px; width: 100%; box-sizing: border-box; border: 1px solid #c5cbe0;
            border-radius: 8px; font-size: 1rem; }
        button { padding: 12px 20px; background: #4b3fd1; color: #fff; border: none; border-radius: 8px;
            cursor: pointer; width: 100%; font-size: 1rem; font-weight: 600; }
        button:hover { background: #3a31a8; }
        button:disabled { opacity: .7; cursor: wait; }
        .error { color: #b00020; font-size: .9rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1><span class="logo">H</span> HSTU Cards</h1>
        <p>Enter the shared password to unlock this study site.</p>
        <input type="password" id="password" placeholder="Password" autofocus autocomplete="current-password">
        <button id="loginBtn">Unlock</button>
        <div id="errorMsg" class="error"></div>
    </div>
    <script>
        const loginBtn = document.getElementById('loginBtn');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMsg');
        function showError(msg) {
            errorMsg.style.display = 'block';
            errorMsg.textContent = msg;
            loginBtn.disabled = false;
            loginBtn.textContent = 'Unlock';
        }
        async function login() {
            const password = passwordInput.value;
            if (!password) return;
            loginBtn.disabled = true;
            loginBtn.textContent = 'Unlocking…';
            errorMsg.style.display = 'none';
            if (!('serviceWorker' in navigator)) {
                showError('This browser cannot unlock the site (no service worker).');
                return;
            }
            try {
                const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
                await navigator.serviceWorker.ready;
                const send = (sw) => new Promise((resolve, reject) => {
                    const ch = new MessageChannel();
                    ch.port1.onmessage = (ev) => ev.data?.ok ? resolve() : reject(new Error(ev.data?.error || 'rejected'));
                    sw.postMessage({ type: 'SET_PASSWORD', password }, [ch.port2]);
                    setTimeout(() => reject(new Error('timeout')), 8000);
                });
                const ctrl = navigator.serviceWorker.controller || (await new Promise((resolve) => {
                    navigator.serviceWorker.addEventListener('controllerchange', () => resolve(navigator.serviceWorker.controller), { once: true });
                    reg.active?.postMessage({ type: 'CLAIM' });
                    setTimeout(() => resolve(navigator.serviceWorker.controller), 1500);
                }));
                if (!ctrl) throw new Error('Service worker did not take control');
                await send(ctrl);
                location.reload();
            } catch (e) {
                console.error(e);
                showError(e.message || String(e));
            }
        }
        loginBtn.addEventListener('click', login);
        passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
    </script>
</body>
</html>
