# Stage 04 — Kubernetes serving path (8.15). `kubectl apply -f stage-04-k8s-deploy.yaml`
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-toy
spec:
  replicas: 1
  selector: { matchLabels: { app: triton-toy } }
  template:
    metadata: { labels: { app: triton-toy } }
    spec:
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:24.07-py3   # VERIFY tag
          args: ["tritonserver", "--model-repository=/models"]
          ports:
            - { containerPort: 8000 }   # HTTP
            - { containerPort: 8001 }   # gRPC
            - { containerPort: 8002 }   # metrics
          resources:
            limits: { nvidia.com/gpu: 1 }
          readinessProbe:
            httpGet: { path: /v2/health/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts: [ { name: models, mountPath: /models } ]
      volumes:
        - name: models
          hostPath: { path: /opt/model_repo }   # replace with a PVC in production
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: triton-toy-hpa }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: triton-toy }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
